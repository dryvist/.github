# Org-wide zizmor policy.
#
# Consumed by every dryvist (and JacobPEvans, via the nix-devenv
# flake-module) repo that runs zizmor. The unpinned-uses audit defaults
# to requiring SHA pins for every action reference, which is the right
# default for untrusted publishers but produces high-friction noise
# (Renovate churn, manual SHA rotation) for action vendors who maintain
# stable major-version tags.
#
# Trusted publishers below are allowed to use `ref-pin` (tag or branch
# references). Everything else falls through to zizmor's implicit
# `hash-pin` default.
#
# `dryvist/*` is the org itself: first-party reusable workflows (e.g.
# dryvist/.github's `_nix-validate.yml`, dryvist/ai-workflows) are
# referenced via `@main` per the self-reference convention, so they must
# be trusted here rather than SHA-pinned.
rules:
  # `secrets: inherit` from thin callers into first-party (dryvist/*)
  # reusable workflows is the org's standard delegation pattern: the callee
  # is same-org and needs repo secrets (Claude OAuth token, GH App keys) at
  # runtime. zizmor cannot scope this audit to first-party callees, so it is
  # disabled centrally rather than re-enumerated as ignores in every repo.
  secrets-inherit:
    disable: true

  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        # astral-sh/* (uv, ruff, setup-uv, ty) is the org-mandated Python
        # toolchain (2026-06); trusted to pin by version tag like actions/*.
        astral-sh/*: ref-pin
        DeterminateSystems/*: ref-pin
        dryvist/*: ref-pin
        # google/* (osv-scanner-action) — same trusted-publisher family as googleapis/*.
        google/*: ref-pin
        googleapis/*: ref-pin
