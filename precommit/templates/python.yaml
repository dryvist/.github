# dryvist python pre-commit template (non-Nix consumers).
#
# Includes the base hook set plus ruff (lint + format) and mypy.
# bandit / detect-secrets are intentionally NOT in this template —
# they were used in 1 inventory repo each and slow the hook cycle
# without proportional value. Repos that want them add the relevant
# `repo:` block locally.
#
# Nix-flake consumers should NOT use this file. They get equivalent
# coverage via `imports = [ inputs.nix-devenv.flakeModules.python ];`.
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trim-trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - --persona=regular
          - --min-severity=medium
          - --min-confidence=medium
          - --config
          - zizmor.yml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
