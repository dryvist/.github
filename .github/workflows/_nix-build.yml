# Reusable: Nix Build (macOS)
# Builds a Nix flake on macOS with store caching.
# Default build command targets home-manager; override for darwin-rebuild.
name: _nix-build

on:
  workflow_call:
    inputs:
      build-command:
        description: "Build command to run (default: home-manager build)"
        required: false
        type: string
        default: "nix build .#homeConfigurations.$(whoami).activationPackage --print-build-logs"

permissions: {}

concurrency:
  group: nix-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # determinate-nix-action@v3 is ONLY a Nix installer (replaced nix-installer-action@v21).
      # It does NOT include flake checking — flake validation is in _nix-validate.yml.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
            http-connections = 50
            connect-timeout = 5
            stalled-download-timeout = 10
            narinfo-cache-positive-ttl = 86400
            fallback = true

      # Restore-only on PRs; saves on pushes to the default branch. Branch-agnostic
      # via `github.event_name != 'pull_request'` because this shared workflow is
      # called by both trunk (main) and git-flow (develop) repos — hardcoding either
      # branch would silently disable saves for half the callers. GitHub scopes a
      # cache to the creating branch plus the default branch, so a push-triggered
      # save lands where PRs can read it.
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          # The activation closure exceeds this cap, so the cache is partial by
          # design; a partial warm store still beats substituting everything.
          gc-max-store-size-macos: 8G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"
