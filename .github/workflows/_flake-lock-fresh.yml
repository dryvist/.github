# Reusable: fail when a direct flake input owned by this org is not at its branch head.
#
# Checks the caller's root flake.lock with scripts/flake-lock-fresh.sh. Only root
# inputs whose owner is the caller's owner are checked; third-party inputs are ignored.
# A repo without a flake.lock passes. Pass GH_APP_PRIVATE_KEY when the lock has
# private inputs; without it, a private input cannot be resolved and fails the check.
name: _flake-lock-fresh

on:
  workflow_call:
    secrets:
      GH_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  fresh:
    name: Flake inputs at branch head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HAS_APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint read token for the owner's repositories
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout flake.lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: flake.lock
          sparse-checkout-cone-mode: false

      - name: Checkout the check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: ${{ job.workflow_sha }}
          path: .gh-shared
          persist-credentials: false
          sparse-checkout: scripts/flake-lock-fresh.sh
          sparse-checkout-cone-mode: false

      - name: Check owned inputs are at branch head
        env:
          OWNERS: ${{ vars.FLAKE_INPUT_OWNERS }}
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .gh-shared/scripts/flake-lock-fresh.sh flake.lock
