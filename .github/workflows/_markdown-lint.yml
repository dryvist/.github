# Reusable: Markdown Lint
# Uses the calling repo's own markdownlint config, falling back to org defaults.
name: _markdown-lint

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-latest. Pass a
          RunsOn label (see runs-on.com/configuration/job-labels) to opt
          the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest

concurrency:
  group: markdown-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout org markdownlint config
        # An empty `github.job_workflow_sha` made the old raw-file fetch
        # resolve to an empty ref, so this checks out the config instead of
        # curling it. actions/checkout resolves dryvist/.github's default
        # branch on its own, with no ref expression that can go empty.
        if: hashFiles('.markdownlint-cli2.jsonc', '.markdownlint-cli2.yaml', '.markdownlint-cli2.cjs', '.markdownlint-cli2.mjs', '.markdownlint.jsonc', '.markdownlint.json', '.markdownlint.yaml', '.markdownlint.yml', '.markdownlint.cjs', '.markdownlint.mjs') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          sparse-checkout: .markdownlint-cli2.yaml
          sparse-checkout-cone-mode: false
          path: .org-markdownlint-checkout
          persist-credentials: false

      - name: Apply org-default markdownlint config
        if: hashFiles('.markdownlint-cli2.jsonc', '.markdownlint-cli2.yaml', '.markdownlint-cli2.cjs', '.markdownlint-cli2.mjs', '.markdownlint.jsonc', '.markdownlint.json', '.markdownlint.yaml', '.markdownlint.yml', '.markdownlint.cjs', '.markdownlint.mjs') == ''
        run: cp .org-markdownlint-checkout/.markdownlint-cli2.yaml .markdownlint-cli2.yaml

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !**/node_modules/**
            # Vendored gh-aw upstream cache: wiped and regenerated by the
            # gh-aw-sync-upstream workflow, so its formatting is not ours to
            # fix. Excluded like node_modules — third-party, machine-managed.
            !**/.github/aw/imports/**
