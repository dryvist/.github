# Reusable: File Size Check
#
# Org defaults live in configs/file-size-defaults.yml (single source of truth).
# Per-repo overrides: repo-root .file-size.yml with extended/exempt/scan only.
# Never commit defaults: in a repo — that block is org-wide policy.
#
# Token partition: when a .token-limits.yaml is present, Markdown (.md) docs are
# token-gated (governed by _token-limits.yml) and dropped from this byte gate's
# scan, so every file is checked by exactly one gate. Repos without a
# .token-limits.yaml are unaffected. (.token-limits.yaml should budget all .md —
# e.g. a '*.md' catch-all — or exclude any it intentionally leaves ungated.)
name: _file-size

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-latest. Pass a
          RunsOn label (see runs-on.com/configuration/job-labels) to opt
          the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest

permissions: {}

concurrency:
  group: file-size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sparse-checkout the shared file-size checker from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: |
            scripts/check-file-sizes.sh
            configs/file-size-defaults.yml
          sparse-checkout-cone-mode: false

      - name: Check file sizes
        env:
          FILE_SIZE_DEFAULTS_CONFIG: .gh-shared/configs/file-size-defaults.yml
        run: bash .gh-shared/scripts/check-file-sizes.sh
