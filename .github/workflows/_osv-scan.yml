# Multi-ecosystem lockfile vulnerability scanning via Google OSV.
#
# Thin wrapper around Google's reusable workflows. Pull requests run Google's
# differential PR scanner and fail only on vulnerabilities introduced by the PR;
# push, schedule, and manual callers run a full scan and fail on any finding.
name: _osv-scan

on:
  workflow_call:
    inputs:
      runner_label:
        description: >-
          GitHub Actions runner label. Defaults to ubuntu-latest. Pass a
          RunsOn label (see runs-on.com/configuration/job-labels) to opt
          the calling repo into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest
      scan_args:
        description: >-
          Extra OSV Scanner arguments. Do not set --format or --output; Google's
          reusable workflows manage those internally.
        type: string
        required: false
        default: |-
          --recursive
          .
      config_file:
        description: >-
          Optional repo-local OSV config path, for example osv-scanner.toml.
          When set, the wrapper passes --config=<path> so the config applies to
          every scanned lockfile.
        type: string
        required: false
        default: ""

concurrency:
  group: osv-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  pr-scan:
    name: OSV Scanner
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        ${{ inputs.config_file != '' && format('--config={0}', inputs.config_file) || '' }}
        ${{ inputs.scan_args }}

  full-scan:
    name: OSV Scanner
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        ${{ inputs.config_file != '' && format('--config={0}', inputs.config_file) || '' }}
        ${{ inputs.scan_args }}
