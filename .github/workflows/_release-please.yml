# Reusable: Release Please (org-native).
#
# Canonical release-please workflow for the org, hosted once here so every repo
# runs identical logic. A calling repo adds a thin
# `.github/workflows/release-please.yml` that `uses:` this file and passes the
# org-level release App private key.
#
# Auth: the org-level release App — app-id from the
# `GH_ACTION_RELEASE_PLEASE_APP_ID` org variable, private key from the
# `GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY` org secret. The App must be installed
# on the org with Contents + Pull requests write. The App token (vs the default
# GITHUB_TOKEN) lets the release PR trigger `pull_request` CI gates.
#
# Behavior:
#   - Eager auto-merge: enables `--auto --squash` on the release PR so it lands
#     once checks pass, for every version bump (patch, minor, or major). Disable
#     with `auto-merge: false` from the caller. Major bumps are NOT special-cased
#     — release-please computes the bump from conventional commits and the result
#     auto-merges like any other.
#
# Config modes (selected by inputs):
#   - Manifest mode (default): the caller's repo holds `release-please-config.json`
#     + `.release-please-manifest.json`; the action reads them via the GitHub API.
#   - Non-manifest mode: the caller passes `config-file: ''`, `manifest-file: ''`
#     and a `release-type` (e.g. `simple`). The repo then needs NO release-please
#     config files — behavior comes from these inputs. Version state is read from
#     the repo's existing tags/releases.
#
# Caller shape (manifest mode — current default):
#   jobs:
#     release-please:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: dryvist/.github/.github/workflows/_release-please.yml@main
#       secrets:
#         GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
name: _release-please

on:
  workflow_call:
    inputs:
      auto-merge:
        description: >-
          Enable eager auto-merge of the release PR once checks pass. Set to
          false to leave the release PR open for manual merge.
        type: boolean
        default: true
      release-type:
        description: >-
          release-please release type (e.g. `simple`). Set this AND blank out
          config-file/manifest-file to run config-free (non-manifest) mode.
        type: string
        default: ''
      config-file:
        description: >-
          Path to release-please-config.json. Blank ('') to run non-manifest mode.
        type: string
        default: release-please-config.json
      manifest-file:
        description: >-
          Path to .release-please-manifest.json. Blank ('') to run non-manifest mode.
        type: string
        default: .release-please-manifest.json
      include-component-in-tag:
        description: >-
          Whether to prefix tags/branches with the component name. Default false.
        type: boolean
        default: false
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: >-
          'true' when this run cut a release (tag + GitHub release), '' or
          'false' otherwise. Lets a caller gate a follow-on job — e.g. fanning
          out a downstream revalidation dispatch only on an actual release.
        value: ${{ jobs.release-please.outputs.release_created }}

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          # Scope the minted token down to exactly what release-please needs
          # (release commits/tags + release PRs) instead of inheriting the
          # App's full installed permissions.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          include-component-in-tag: ${{ inputs.include-component-in-tag }}

      # Take the PR number from the action's own `pr` output (a JSON PullRequest
      # object) rather than re-querying by branch name — release branch names vary
      # (component suffixes), and an exact `gh pr list --head` match silently
      # misses them. The raw JSON is passed as a string and parsed with jq in the
      # script: `fromJSON()` in an `env:` value is evaluated even when the step's
      # `if` is false, so on a release-CUTTING run (no PR opened, `pr` is empty)
      # `fromJSON('')` would throw a template error and fail the whole workflow.
      # Disable+re-enable handles GitHub's stale auto-merge queue; the retry loop
      # handles transient GraphQL errors from `gh pr merge --auto`.
      - name: Enable auto-merge for the release PR (with re-poke + retry)
        if: ${{ !cancelled() && inputs.auto-merge && steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # This job has no checkout, so gh cannot infer the repo from a local
          # git remote — set it explicitly, or `gh pr merge` fails with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          gh pr merge "$PR_NUMBER" --disable-auto 2>/dev/null || true
          for _ in 1 2 3; do gh pr merge "$PR_NUMBER" --auto --squash && exit 0; sleep 15; done
          exit 1
