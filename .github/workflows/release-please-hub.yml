# Central release-please hub for the whole org.
#
# One place cuts releases for every repo that carries a release-please config —
# no per-repo workflow files. Required-workflow rulesets can't host this (they
# run on pull_request/merge_group only, never push), so instead of forcing a
# per-repo workflow this runs the release-please CLI against each repo via
# --repo-url using an org App token. Repos opt in by adding
# release-please-config.json + .release-please-manifest.json to their default
# branch.
#
# Org App creds live ONLY here: app id in the GH_ACTION_RELEASE_PLEASE_APP_ID
# org variable, private key in the GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY org
# secret. The App must be installed on the org with Contents + Pull requests
# write. Action refs are digest-pinned to their current-latest releases.
name: release-please-hub

on:
  schedule:
    # Once daily, overnight (≈ 03:37 America/Indiana/Indianapolis). Off the
    # top-of-hour to avoid GitHub's cron congestion.
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-hub
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out this repo (for the hub script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate org App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Run release-please for every configured repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/release-please-hub.sh
