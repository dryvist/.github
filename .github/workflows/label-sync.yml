name: Sync labels from labels.yml

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The canonical repo is pruned to exactly labels.yml (delete-other-labels).
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automation
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync labels to this repo from labels.yml
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true

  # Enumerate the public repos to fan out to (this .github repo excluded).
  # Public listing only, so the repo-scoped GITHUB_TOKEN is sufficient and no
  # cross-repo credential is minted here. The fan-out below mints its own,
  # scoped to one repo per matrix leg.
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      # `set -euo pipefail` + jq's own emptiness assertion fail at the source:
      # an auth/rate-limit/network error must not silently become a no-op
      # matrix (the swallowed-failure mode this PR exists to remove).
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repos=$(gh repo list "$ORG" --visibility public --limit 100 --json name \
            --jq 'map(.name | select(. != ".github")) | if length == 0 then error("empty repo listing — refusing to sync nothing") else . end')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  # Fan out one isolated job per repo. Same trusted, pinned action as `self`,
  # retargeted by overriding GITHUB_REPOSITORY (EndBug/label-sync reads its
  # target from that env var) and authenticated with an App installation token
  # minted for that one repository.
  # Replaces the previous `gh label clone` loop, which deadlocked
  # (`all goroutines are asleep`) on every repo and swallowed the failure.
  # Additive by design (delete-other-labels defaults to false) to match the
  # old clone behavior; the canonical prune stays on `self`.
  sync:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Scoped to exactly the repo this matrix leg writes to.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-issues: write
      - name: Sync labels to ${{ matrix.repo }}
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        env:
          GITHUB_REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repo }}
        with:
          config-file: .github/labels.yml
          token: ${{ steps.app-token.outputs.token }}
