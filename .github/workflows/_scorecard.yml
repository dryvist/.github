# Reusable: OpenSSF Scorecard (security posture)
#
# Measures the repo's overall security practices and fails when the aggregate
# score drops below a floor. Complements the scans already in the gate:
# `_osv-scan.yml` covers dependency vulnerabilities and `_zizmor.yml` covers
# workflow security; neither says anything about the repo's practices as a
# whole.
#
# `publish_results: false` deliberately: publishing to the Scorecard API is
# only valid from the default branch, and a PR run must never publish. That
# also means the action needs no `id-token: write`, so consumers grant nothing
# beyond the gate's existing permissions.
#
# No SARIF upload, for the same reason `_osv-scan.yml` sets `upload-sarif:
# false` — see the `_ci-gate.yml` header on why `security-events: write` is
# kept out of the gate (github/codeql-action#2117).
name: _scorecard

on:
  workflow_call:
    inputs:
      blocking_checks:
        description: >-
          Comma-separated Scorecard checks that MUST score 10. This is the
          enforcing half of the gate, and it is deliberately narrow: only
          checks that are (a) deterministic and (b) caused by files in the
          diff belong here.

          Defaults to Dangerous-Workflow (untrusted checkout / script
          injection — the "pwn request" class) and Binary-Artifacts (a
          committed executable). Both are properties a pull request can
          introduce and a reviewer can fix.

          A check that is absent or reports -1 (not applicable to this repo)
          is skipped, never failed.
        type: string
        required: false
        default: Dangerous-Workflow,Binary-Artifacts
      min_score:
        description: >-
          Aggregate Scorecard floor, 0-10. Fails below this value.

          Defaults to 0 (REPORT-ONLY) on purpose, and this is not a rollout
          hedge. The aggregate mixes in checks that measure repo state rather
          than the diff — `Maintained` decays with 90-day activity,
          `Vulnerabilities` moves when a CVE lands in OSV overnight,
          `Code-Review` reflects past PR history. Hard-failing on it would
          block pull requests for reasons no reviewer can act on and no diff
          caused. Enforcement lives in `blocking_checks` instead, which is
          attributable.

          A repo may raise this to hold a line it has already earned. A
          MISSING score fails at any floor, including 0.
        type: number
        required: false
        default: 0
      runner_label:
        description: >-
          Runner label. Defaults to ubuntu-latest; pass a RunsOn label to opt
          into self-hosted runners.
        type: string
        required: false
        default: ubuntu-latest

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      # Scorecard reads workflow run history for the CI-Tests / SAST checks.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - name: Sparse-checkout enforcement script from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/scorecard-enforce.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Enforce posture
        env:
          RESULTS: scorecard.json
          BLOCKING_CHECKS: ${{ inputs.blocking_checks }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: bash .gh-shared/scripts/scorecard-enforce.sh
