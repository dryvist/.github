name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    # Self-referencing local `uses:` — this repo IS dryvist/.github, so it
    # cannot pin itself at @main the way every other caller in the org does.
    uses: ./.github/workflows/_release-please.yml
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
