# Org-wide AI review of every pull request, enforced via Required Workflows.
#
# Referenced by dryvist/tofu-github's github_organization_ruleset
# (`org-ai-review`), which injects this workflow into the pull requests of
# EVERY repo in the org — no per-repo `uses:` caller, so a repo cannot opt out
# by omission. It mirrors markdownlint.yml (the proven required-workflow
# pattern) and defers the actual review to dryvist/ai-workflows' reusable
# PR-Agent workflow, which reads each repo's own `.pr_agent.toml` for its
# checklist.
#
# Where the review runs is decided by repository visibility, as data on the
# one call below — never by a second job:
#
#   private repo -> the shared self-hosted pool and the internal model router,
#                   because only that pool reaches the router. The diff never
#                   leaves the estate.
#   public repo  -> a GitHub-hosted runner and an external OpenAI-compatible
#                   model endpoint. The diff is already public, GitHub-hosted
#                   minutes cost nothing on a public repo, and the self-hosted
#                   pool keeps its slots for the private work.
#
# Both endpoint pairs are org secrets synced from the secret manager, and
# this file is the only place a private repo's review could reference the
# public pair: the expressions below hand a private repo the router pair, and
# the only fall-through is public -> router, which a GitHub-hosted runner
# cannot reach and therefore fails at once. The public model ids are literals
# here on purpose: with no router in that path there is no alias to resolve,
# and this file is the one place they are set.
#
# An endpoint that is down or at capacity fails the review within seconds —
# never a green check that reviewed nothing. Whether that failure blocks the
# merge is the ruleset's enforcement mode (tofu-github), not this file's.
#
# No concurrency block here on purpose: the reusable workflow already scopes
# its group per pull request, and a caller sharing that exact group causes an
# opaque 0-job startup_failure.
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Renovate and release-please pull requests are version bumps and
  # changelog/lockfile edits by construction; a model review of them answers
  # nothing. For those authors the workflow still runs — this job, on a
  # GitHub-hosted runner, with no secret and no model — so the required
  # workflow completes successfully in seconds instead of relying on how a
  # skipped run is judged. Author, not actor: a reopen or a rebase is
  # performed by whoever clicked, the author stays the bot.
  dependency-bot:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'jacobpevans-release-please[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Dependency or release pull request
        run: echo "Not reviewed by a model - the author is a dependency or release bot."

  pr-agent:
    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'jacobpevans-release-please[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/pr-agent.yml@main
    with:
      review: true
      # improve stays off: over 84 org-wide runs (2026-09-18/19) it took a
      # median 62 s of model time per pull request — more than the review
      # itself — and produced "No code suggestions" three times out of four.
      # A repository that wants suggestions opts in through its own caller.
      runner_label: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      model: ${{ github.event.repository.private && 'cheap' || 'glm-5.3-flash' }}
      fallback_model: ${{ github.event.repository.private && 'subagent' || 'glm-5.3-flash' }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ !github.event.repository.private && secrets.LLM_PUBLIC_REVIEW_BASE_URL || secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ !github.event.repository.private && secrets.LLM_PUBLIC_REVIEW_API_KEY || secrets.LLM_ROUTER_API_KEY }}
