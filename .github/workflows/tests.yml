# Runs the unit tests for the scripts this repo ships. Repo-local; the
# ubuntu-latest image's Node (22) has `node --test` built in; the glob form is
# required there — a bare directory argument only works on Node 24+.
name: Tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'

permissions: {}

jobs:
  node:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test 'tests/**/*.test.js'
