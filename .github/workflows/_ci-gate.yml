# Reusable: CI Gate (Merge Gatekeeper)
#
# Centralizes the conditional-required-check pattern that previously lived as
# duplicated `ci-gate.yml` files in every consumer repo.
#
# What this workflow does:
#
#   changes  -> dorny/paths-filter on caller-supplied filters
#   <check jobs> -> per-check reusable workflows, gated on (input toggle && filter)
#   watchdog -> sleeps queue_timeout_minutes, cancels any sibling job still
#               in `queued` state so the gate is never blocked indefinitely
#   gate     -> name MUST stay "Merge Gate" (matches branch protection rulesets);
#               aggregates results via re-actors/alls-green
#
# Why the watchdog exists:
#
# GitHub Actions only schedules a `needs:` dependent once every upstream job
# reaches a *terminal* state (success/failure/cancelled/skipped). A job stuck
# in `queued` (e.g. self-hosted runner never picks it up) is NOT terminal, so
# `gate` never runs and the required `Merge Gate` status never reports. The
# watchdog forces a terminal state by cancelling stuck queued jobs.
#
# Caller requirements (thin consumer shape):
#
#   jobs:
#     gate:
#       permissions:
#         contents: read
#         pull-requests: read
#         actions: write   # REQUIRED: the watchdog cancels queued jobs via the
#                          # Actions API, and a called workflow can never exceed
#                          # the caller's token grant — omitting this fails the
#                          # entire run at workflow-graph validation
#                          # (startup_failure, 0s, no jobs, UI-only error).
#       uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
#       with:
#         markdown_lint: true
#         file_size: true
#         filters: |
#           markdown:
#             - '**.md'
#             - '.markdownlint*'
#
# Filter name convention (caller defines these in `filters:` input):
#
#   nix            -> gates `nix_validate`
#   markdown       -> gates `markdown_lint`, `file_size`, and `token_limits`
#   python         -> gates `python_security`
#
# Callers may include additional filters; this workflow ignores them. To add
# a new conditional check, add: input toggle, conditional job, and entry in
# the gate's `needs:` and `allowed-skips`.

name: _ci-gate

on:
  workflow_call:
    inputs:
      filters:
        description: >-
          YAML body for dorny/paths-filter. Use the convention names listed
          in this file's header to enable the matching conditional check.
        type: string
        required: true

      nix_validate:
        description: Enable `Nix Validate` (gated on `nix` filter)
        type: boolean
        default: false
      all_systems:
        description: >-
          Pass --all-systems to `nix flake check`. Default true catches
          darwin-only `meta.broken` packages from a linux runner. Set false
          only when consumer flakes declare platform-specific check
          derivations that cannot be made platform-aware (rare — prefer
          fixing the flake to use `runCommandLocal` or to scope source-only
          checks to the CI system).
        type: boolean
        default: true
      markdown_lint:
        description: Enable `Markdown Lint` (gated on `markdown` filter)
        type: boolean
        default: false
      file_size:
        description: Enable `File Size` (gated on `nix` OR `markdown` filter)
        type: boolean
        default: false
      token_limits:
        description: >-
          Enable `Token Limits` (gated on `markdown` filter). Budgets AI-read
          docs via tiktoken per .token-limits.yaml; pairs with `file_size`,
          which skips token-gated files. No secret required.
        type: boolean
        default: false
      python_security:
        description: Enable `Python Security` (gated on `python` filter)
        type: boolean
        default: false
      python_security_dirs:
        description: Space-separated dirs passed to _python-security.yml
        type: string
        default: ''
      python_ci:
        description: Enable `Python CI` lint/format/type/test gate (gated on `python` filter)
        type: boolean
        default: false
      python_ci_versions:
        description: >-
          JSON array of Python versions for the Python CI pytest matrix. Default
          covers ALL currently non-EOL Python releases; a consumer narrows it
          (e.g. to min + latest) by passing its own array.
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'

      runner_label:
        description: >-
          GitHub Actions runner label for the orchestration jobs in this
          workflow (`Detect Changes`, `Queue Watchdog`, `Merge Gate`). Also
          passed through to every child reusable workflow this gate calls
          (`Nix Validate`, `Markdown Lint`, `File Size`, `Python Security`),
          so a single input migrates the whole gate.
          Defaults to ubuntu-latest. Pass a RunsOn label
          (see runs-on.com/configuration/job-labels) to opt in.
        type: string
        required: false
        default: ubuntu-latest

      queue_timeout_minutes:
        description: >-
          Minutes the watchdog waits before cancelling sibling jobs still in
          `queued` state. Default 10. Cap your slowest gate-path job at well
          below this value or it will be killed before it starts.
        type: number
        default: 10

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner_label }}
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      markdown: ${{ steps.filter.outputs.markdown }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: ${{ inputs.filters }}

  # ============================================================================
  # CONDITIONAL CHECKS
  # Each is gated on `inputs.<toggle>` AND `needs.changes.outputs.<filter>`.
  # Disabled or untouched paths skip; `re-actors/alls-green` accepts skips.
  # ============================================================================
  nix-validate:
    name: Nix Validate
    needs: changes
    if: ${{ inputs.nix_validate && needs.changes.outputs.nix == 'true' }}
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@main
    with:
      all_systems: ${{ inputs.all_systems }}
      runner_label: ${{ inputs.runner_label }}

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: ${{ inputs.markdown_lint && needs.changes.outputs.markdown == 'true' }}
    uses: dryvist/.github/.github/workflows/_markdown-lint.yml@main
    with:
      runner_label: ${{ inputs.runner_label }}

  file-size:
    name: File Size
    needs: changes
    if: ${{ inputs.file_size && (needs.changes.outputs.nix == 'true' || needs.changes.outputs.markdown == 'true') }}
    uses: dryvist/.github/.github/workflows/_file-size.yml@main
    with:
      runner_label: ${{ inputs.runner_label }}

  token-limits:
    name: Token Limits
    needs: changes
    if: ${{ inputs.token_limits && needs.changes.outputs.markdown == 'true' }}
    uses: dryvist/.github/.github/workflows/_token-limits.yml@main
    with:
      runner_label: ${{ inputs.runner_label }}

  python-security:
    name: Python Security
    needs: changes
    if: ${{ inputs.python_security && needs.changes.outputs.python == 'true' }}
    uses: dryvist/.github/.github/workflows/_python-security.yml@main
    with:
      python-dirs: ${{ inputs.python_security_dirs }}
      runner_label: ${{ inputs.runner_label }}
    # No `secrets: inherit` — _python-security.yml declares and consumes no
    # secrets, and unconditional inheritance trips zizmor's secrets-inherit
    # audit. (Divergence from the JacobPEvans-personal original, on purpose.)

  python-ci:
    name: Python CI
    needs: changes
    if: ${{ inputs.python_ci && needs.changes.outputs.python == 'true' }}
    uses: dryvist/.github/.github/workflows/_python-ci.yml@main
    with:
      python_versions: ${{ inputs.python_ci_versions }}
      runner_label: ${{ inputs.runner_label }}

  # ============================================================================
  # WATCHDOG
  # Forces a terminal state for queued sibling jobs after queue_timeout_minutes.
  # Itself reports success regardless — its job is to unstick the gate.
  # ============================================================================
  watchdog:
    name: Queue Watchdog
    needs: changes
    runs-on: ${{ inputs.runner_label }}
    permissions:
      actions: write   # required to cancel sibling jobs
      contents: read   # required for actions/checkout sparse-checkout
    # Hardcoded ceiling — GHA expressions don't support arithmetic so this
    # can't be derived from `queue_timeout_minutes`. 30 min handles up to a
    # ~25-minute queue_timeout with comfortable margin.
    timeout-minutes: 30
    steps:
      - name: Sparse-checkout watchdog script from this repo
        uses: actions/checkout@v6
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-watchdog.sh
          sparse-checkout-cone-mode: false
      - name: Sleep, then cancel any sibling job still queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_TIMEOUT_MINUTES: ${{ inputs.queue_timeout_minutes }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .gh-shared/scripts/ci-gate-watchdog.sh

  # ============================================================================
  # MERGE GATE — the only check that branch protection requires.
  # `name:` MUST stay "Merge Gate" (matches existing required_status_checks).
  # ============================================================================
  gate:
    name: Merge Gate
    needs: [changes, watchdog, nix-validate, markdown-lint, file-size, token-limits, python-security, python-ci]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          # `watchdog` is always-success-on-completion; treating it as
          # allowed-skip lets `alls-green` ignore its result either way.
          allowed-skips: nix-validate, markdown-lint, file-size, token-limits, python-security, python-ci, watchdog
          jobs: ${{ toJSON(needs) }}
