---
name: Agent Platform Fixtures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-platform-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixture (${{ matrix.hook }}, ${{ matrix.file }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {hook: yaml, file: roles/example/clean.yml, status: 1}
          - {hook: yaml, file: roles/example/literal.yml, status: 1}
          - {hook: yaml, file: roles/example/quoted.yaml, status: 1}
          - {hook: yaml, file: roles/example/folded.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-short-prompt.yml, status: 1}
          - {hook: yaml, file: roles/example/vars/inline-single-line-prompt.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-wrapped-template.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-multiline-expression.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/catalog-reference-newline.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-system-prompt.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-templated-prompt.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-prompt-template.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/inline-persona.yml, status: 1}
          - {hook: yaml, file: roles/example/vars/inline-instructions.yml, status: 1}
          - {hook: yaml, file: roles/example/vars/inline-prompt.yml, status: 0}
          - {hook: yaml, file: roles/example/vars/inline-message.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/catalog-references.yml, status: 0}
          - {hook: yaml, file: roles/example/defaults/inline-suffixed-prompt.yml, status: 1}
          - {hook: yaml, file: roles/example/defaults/suffixed-catalog-reference.yml, status: 0}
          - {hook: yaml, file: roles/example/defaults/suffixed-variable-reference.yml, status: 0}
          - {hook: yaml, file: roles/example/defaults/suffixed-short-label.yml, status: 0}
          - {hook: yaml, file: roles/example/defaults/excepted-long-prompt.yml, status: 1}
          - {hook: prompt-exceptions, file: roles/example/defaults/excepted-prompt.yml, status: 0, warning: true}
          - {hook: yaml, file: outside.yml, status: 0}
          - {hook: prompt-files, file: roles/example/template.prompt, status: 1}
          - {hook: prompt-files, file: roles/example/example-prompt.md, status: 1}
          - {hook: prompt-files, file: roles/example/system_prompt.txt, status: 1}
          - {hook: prompt-files, file: roles/example/clean.yml, status: 0}
          - {hook: paths, file: gpu-fill.txt, status: 1}
          - {hook: paths, file: gpu_fill.txt, status: 1}
          - {hook: paths, file: fill-worker.txt, status: 1}
          - {hook: paths, file: fill_worker.txt, status: 1}
          - {hook: paths, file: outside.yml, status: 0}
          - {hook: paths, file: gpu-fill-empty.txt, status: 1}
          - {hook: paths, file: gpu-fill/CHANGELOG.md, status: 0}
          - {hook: identifiers, file: names.yml, status: 1}
          - {hook: identifiers, file: gpu-fill.txt, status: 1}
          - {hook: identifiers, file: gpu_fill.txt, status: 1}
          - {hook: identifiers, file: fill-worker.txt, status: 1}
          - {hook: identifiers, file: fill_worker.txt, status: 1}
          - {hook: identifiers, file: outside.yml, status: 0}
          - {hook: identifiers, file: gpu-fill/CHANGELOG.md, status: 0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install fixture tools
        run: python -m pip install pre-commit==4.7.0 check-jsonschema==0.39.0
      - name: Validate shared config
        run: |
          pre-commit validate-config precommit/templates/agent-platform.yaml
          check-jsonschema --check-metaschema precommit/configs/agent-platform.schema.json
      - name: Check fixture exit status
        env:
          HOOK: ${{ matrix.hook }}
          FIXTURE: ${{ matrix.file }}
          EXPECTED: ${{ matrix.status }}
          EXPECT_WARNING: ${{ matrix.warning || false }}
        run: |
          actual=0
          output=$(pre-commit run --config precommit/templates/agent-platform.yaml \
            "agent-platform-$HOOK" --files "precommit/tests/fixtures/$FIXTURE" 2>&1) || actual=$?
          printf '%s\n' "$output"
          test "$actual" -eq "$EXPECTED"
          if [[ "$EXPECT_WARNING" == "true" ]]; then
            printf '%s\n' "$output" | grep -Fq '::warning title=Agent platform prompt exception::'
          fi

  caller-fixtures:
    name: Caller fixture (${{ matrix.file }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {file: roles/example/clean.yml, status: 1}
          - {file: roles/example/defaults/inline-short-prompt.yml, status: 1}
          - {file: roles/example/vars/inline-single-line-prompt.yml, status: 1}
          - {file: roles/example/defaults/inline-wrapped-template.yml, status: 1}
          - {file: roles/example/defaults/inline-multiline-expression.yml, status: 1}
          - {file: roles/example/defaults/catalog-reference-newline.yml, status: 1}
          - {file: roles/example/literal.yml, status: 1}
          - {file: roles/example/defaults/inline-system-prompt.yml, status: 1}
          - {file: roles/example/defaults/inline-templated-prompt.yml, status: 1}
          - {file: roles/example/defaults/catalog-references.yml, status: 0}
          - {file: roles/example/vars/inline-prompt.yml, status: 0}
          - {file: roles/example/defaults/inline-suffixed-prompt.yml, status: 1}
          - {file: roles/example/defaults/suffixed-catalog-reference.yml, status: 0}
          - {file: roles/example/defaults/suffixed-variable-reference.yml, status: 0}
          - {file: roles/example/defaults/suffixed-short-label.yml, status: 0}
          - {file: roles/example/defaults/excepted-long-prompt.yml, status: 1}
          - {file: roles/example/defaults/excepted-prompt.yml, status: 0, warning: true}
          - {file: roles/example/template.prompt, status: 1}
          - {file: gpu-fill-empty.txt, status: 1}
          - {file: names.yml, status: 1}
          - {file: gpu-fill/CHANGELOG.md, status: 0}
    steps:
      - name: Checkout shared configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install fixture tools
        run: python -m pip install pre-commit==4.7.0 check-jsonschema==0.39.0
      - name: Check all tracked caller files with an external template
        env:
          FIXTURE: ${{ matrix.file }}
          EXPECTED: ${{ matrix.status }}
          EXPECT_WARNING: ${{ matrix.warning || false }}
        run: |
          mkdir -p caller
          cd caller
          git init
          mkdir -p "$(dirname "$FIXTURE")" precommit/configs
          cp "../precommit/tests/fixtures/$FIXTURE" "$FIXTURE"
          git add "$FIXTURE"
          cp ../precommit/configs/agent-platform.schema.json precommit/configs/
          cp ../precommit/configs/agent-platform-prompt-exceptions-2026-11-07.txt precommit/configs/
          actual=0
          output=$(pre-commit run --config ../precommit/templates/agent-platform.yaml --all-files 2>&1) || actual=$?
          printf '%s\n' "$output"
          test "$actual" -eq "$EXPECTED"
          if [[ "$EXPECT_WARNING" == "true" ]]; then
            printf '%s\n' "$output" | grep -Fq '::warning title=Agent platform prompt exception::'
          fi
