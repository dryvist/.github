# Reusable: Ansible CI (Merge Gatekeeper for ansible repos)
#
# Centralizes the ansible CI that previously lived as divergent inline/local
# workflows in every ansible repo (ansible-proxmox, ansible-proxmox-apps,
# ansible-splunk). It owns the parts that ARE common and must be consistent:
#
#   changes  -> dorny/paths-filter on a SINGLE standardized ansible filter
#               (includes roles/**/*.j2 — a template-only change must lint)
#   ansible-lint -> gated on the `ansible` filter (scripts/ansible-ci-lint.sh)
#   molecule -> gated on the `molecule` filter; scenarios DISCOVERED from the
#               repo, optional masked least-privilege Doppler key export
#   watchdog -> unsticks the gate when a sibling job hangs `queued`
#   gate     -> name MUST stay "Merge Gate" (branch-protection ruleset)
#
# All non-trivial bash lives in scripts/ (sparse-checked-out per job, pinned to
# this workflow's own commit so a branch under test uses its matching scripts) —
# the workflow YAML stays logic-free, matching the _ci-gate.yml watchdog pattern.
#
# Repo-specific data-contract tests (inventory schema/load, template render,
# bespoke syntax checks) and self-hosted e2e are NOT centralized — they live in
# the caller. Such callers set `emit_gate: false` and run their OWN "Merge Gate"
# aggregating this workflow's result plus their local jobs.
#
# Thin caller (no extra local jobs — proxmox):
#   jobs:
#     ci:
#       permissions: { contents: read, pull-requests: read, actions: write }
#       uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main

name: _ansible-ci

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version for lint + molecule jobs.
        type: string
        default: "3.13"
      lint_scope:
        description: >-
          Args passed to ansible-lint (e.g. 'playbooks/ roles/'). Empty = whole
          project (ansible-lint default discovery).
        type: string
        default: ""
      yamllint:
        description: Also run `yamllint .` in the lint job.
        type: boolean
        default: false
      molecule:
        description: Enable the molecule job (gated on the `molecule` filter).
        type: boolean
        default: true
      molecule_doppler_keys:
        description: >-
          Space-separated Doppler secret names to export (masked) into the
          molecule job. Empty = no secrets. Requires the `doppler_token` secret.
        type: string
        default: ""
      doppler_project:
        description: Doppler project for molecule_doppler_keys.
        type: string
        default: "iac-conf-mgmt"
      doppler_config:
        description: Doppler config for molecule_doppler_keys.
        type: string
        default: "prd"
      emit_gate:
        description: >-
          Emit the required "Merge Gate". Set false when the CALLER runs its own
          "Merge Gate" aggregating repo-local jobs (avoids a duplicate check).
        type: boolean
        default: true
      runner_label:
        description: Runner label for all jobs.
        type: string
        default: ubuntu-latest
      queue_timeout_minutes:
        description: Minutes before the watchdog cancels jobs stuck `queued`.
        type: number
        default: 10
    secrets:
      doppler_token:
        description: Doppler service token, only needed for molecule_doppler_keys.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner_label }}
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      molecule: ${{ steps.filter.outputs.molecule }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            ansible:
              - '**.yml'
              - '**.yaml'
              - '**.j2'
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'molecule/**'
              - '.ansible-lint'
              - '.yamllint'
              - 'requirements.yml'
            molecule:
              - 'roles/**'
              - 'molecule/**'
              - 'requirements.yml'

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - uses: actions/checkout@v6
      - name: Sparse-checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest
      - name: Lint
        env:
          YAMLLINT: ${{ inputs.yamllint }}
          LINT_SCOPE: ${{ inputs.lint_scope }}
        run: bash .gh-shared/scripts/ansible-ci-lint.sh

  molecule-discover:
    name: Discover Molecule Scenarios
    needs: changes
    if: ${{ inputs.molecule && needs.changes.outputs.molecule == 'true' }}
    runs-on: ${{ inputs.runner_label }}
    outputs:
      scenarios: ${{ steps.d.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v6
      - name: Sparse-checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - name: Discover
        id: d
        run: bash .gh-shared/scripts/ansible-ci-discover-scenarios.sh

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: molecule-discover
    if: ${{ needs.molecule-discover.result == 'success' && needs.molecule-discover.outputs.scenarios != '[]' }}
    runs-on: ${{ inputs.runner_label }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.molecule-discover.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v6
      - name: Sparse-checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest
      - name: Install molecule + dependencies
        run: bash .gh-shared/scripts/ansible-ci-molecule-deps.sh
      - name: Export selected Doppler secrets
        if: ${{ inputs.molecule_doppler_keys != '' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.doppler_token }}
          KEYS: ${{ inputs.molecule_doppler_keys }}
          PROJECT: ${{ inputs.doppler_project }}
          CONFIG: ${{ inputs.doppler_config }}
        run: bash .gh-shared/scripts/ansible-ci-doppler-export.sh
      - name: Run molecule
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  watchdog:
    name: Queue Watchdog
    needs: changes
    runs-on: ${{ inputs.runner_label }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Sparse-checkout watchdog script
        uses: actions/checkout@v6
        with:
          repository: dryvist/.github
          ref: main
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-watchdog.sh
          sparse-checkout-cone-mode: false
      - name: Sleep, then cancel any sibling job still queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_TIMEOUT_MINUTES: ${{ inputs.queue_timeout_minutes }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .gh-shared/scripts/ci-gate-watchdog.sh

  gate:
    name: Merge Gate
    needs: [changes, ansible-lint, molecule-discover, molecule, watchdog]
    if: ${{ inputs.emit_gate && always() && !cancelled() }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: ansible-lint, molecule-discover, molecule, watchdog
          jobs: ${{ toJSON(needs) }}
