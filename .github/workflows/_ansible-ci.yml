# Reusable: Ansible CI (Merge Gatekeeper for ansible repos)
#
# Centralizes the ansible CI that drifted into divergent inline/local workflows
# across ansible-proxmox, ansible-proxmox-apps and ansible-splunk. Owns the parts
# that must be consistent, using only off-the-shelf actions (no scripts):
#
#   changes      -> dorny/paths-filter on ONE standardized filter (incl. *.j2)
#   ansible-lint -> ansible/ansible-lint
#   molecule     -> matrix from the caller's `molecule_scenarios`, narrowed on
#                   a pull request by `molecule_scenario_filters`, optional
#                   Doppler secrets via dopplerhq/secrets-fetch-action
#   token-limits -> _token-limits.yml, so a repo's .token-limits.yaml is
#                   enforced; a no-op where that file is absent
#   gate         -> name MUST stay "Merge Gate" (branch-protection ruleset)
#
# Repo-specific data-contract tests (inventory schema/load, template render,
# bespoke syntax) and self-hosted e2e are NOT centralized — they live in the
# caller, which runs its own "Merge Gate" aggregating this workflow's result
# plus the local jobs (emit_gate defaults to false for exactly that reason).
#
# Thin caller (no extra local jobs) — pass emit_gate: true to get the gate:
#   jobs:
#     ci:
#       permissions: { contents: read, pull-requests: read }
#       uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main
#       with: { emit_gate: true }
# Scope policy (canonical): a check runs in proportion to the change that
# triggered it; the one guaranteed end-to-end sweep is promotion to a
# git-flow repo's production branch. Narrow at the consumer, never in a
# filter several repos share, and never let the job that decides what to
# skip be skippable itself.
# https://docs.jacobpevans.com/d/decisions/ci-scope-follows-the-change/
#

name: _ansible-ci

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version for the molecule job.
        type: string
        default: "3.13"
      lint_args:
        description: Extra args for ansible/ansible-lint (e.g. 'playbooks/ roles/').
        type: string
        default: ""
      molecule:
        description: Enable the molecule job (gated on the `molecule` filter).
        type: boolean
        default: true
      molecule_scenarios:
        description: JSON array of molecule scenario names to run as a matrix.
        type: string
        default: '["default"]'
      molecule_scenario_filters:
        description: >-
          Optional YAML map of molecule scenario name -> paths, in
          dorny/paths-filter syntax. When set, a pull request runs only the
          scenarios whose paths changed instead of the whole
          `molecule_scenarios` matrix; a push to the default branch always runs
          the full matrix. Unset (the default) keeps the previous behaviour.
        type: string
        default: ""
      full_matrix_base:
        description: >-
          Branch whose incoming pull requests always run the FULL molecule
          matrix, regardless of `molecule_scenario_filters`. The scope policy
          above names promotion into a git-flow repo's production branch as the
          one guaranteed end-to-end sweep, and in a repo whose CI fires only on
          `pull_request` that promotion PR is the only place the sweep can
          happen.
        type: string
        default: main
      molecule_requirements:
        description: >-
          Pip requirements file with the molecule job's dependencies (each repo
          owns one so its driver + version pins are respected).
        type: string
        default: "requirements-ci.txt"
      molecule_doppler:
        description: Inject iac-conf-mgmt secrets into the molecule job (needs doppler_token).
        type: boolean
        default: false
      doppler_project:
        description: Doppler project for molecule secrets.
        type: string
        default: "iac-conf-mgmt"
      doppler_config:
        description: Doppler config for molecule secrets.
        type: string
        default: "prd"
      emit_gate:
        description: >-
          Emit the required "Merge Gate". Set false when the CALLER runs its own
          "Merge Gate" aggregating repo-local jobs (avoids a duplicate check).
          Default false: every caller so far runs its own gate (or is called
          from `_ci-gate.yml`, which is the gate).
        type: boolean
        default: false
      renovate_annotations:
        description: >-
          Enable `Renovate Annotations` (fails on an unannotated version pin
          under a path the annotated-pin Renovate customManagers cover, via
          `_renovate-annotations.yml`, gated on this workflow's own `ansible`
          filter above). Every Ansible repo in the org calls THIS workflow
          directly, not `_ci-gate.yml` (see its own `renovate_annotations`
          input) — so this is the only place the check is actually reachable
          for the Ansible fleet. Default false: opt in per repo.
        type: boolean
        default: false
      runner_label:
        description: >-
          Runner label for the quick jobs (changes, ansible-lint, gate). These
          finish in well under a minute on hosted runners, so they stay hosted
          by default; `molecule_runner_label` retargets the heavy molecule job
          separately.
        type: string
        default: ubuntu-latest
      molecule_runner_label:
        description: >-
          Runner label for the molecule job only. Default ubuntu-latest keeps it
          hosted; a caller whose repo has the self-hosted fleet passes a fleet
          label (e.g. `proxmox`) to run molecule on a pre-baked runner. Fork PRs
          always fall back to ubuntu-latest so fork-author code never runs on the
          fleet (guard idiom matches _ci-gate.yml).
        type: string
        default: ubuntu-latest
    secrets:
      doppler_token:
        description: Doppler service token, only needed when molecule_doppler is true.
        required: false
    outputs:
      ansible:
        description: >-
          Whether ansible-relevant files changed (the standardized filter).
          Callers gate their own repo-local jobs on this so every job in the
          repo shares ONE change-detection definition.
        value: ${{ jobs.changes.outputs.ansible }}
      molecule:
        description: Whether molecule-relevant files changed (the standardized filter).
        value: ${{ jobs.changes.outputs.molecule }}
      molecule_scenarios:
        description: >-
          JSON array of the scenarios a pull request touched, or an empty
          string meaning "run every scenario". A caller that owns molecule
          locally (`molecule: false`) reads this to narrow its own matrix, so
          every repo shares ONE change-detection definition. Empty is the only
          widening signal a consumer has to handle; the rules that produce it
          live in the changes job.
        value: ${{ jobs.changes.outputs.molecule_scenarios }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      molecule: ${{ steps.filter.outputs.molecule }}
      # Normalized ONCE, here, so every consumer shares one contract: an empty
      # string means "run every scenario". Widening happens for a push, for a
      # pull request into the production branch, and when the map matched
      # nothing — that last case means the map does not cover the change (an
      # unmapped role, a new scenario, a requirements bump), and narrowing
      # there would leave an empty matrix, a skipped job and a green gate
      # having tested nothing.
      molecule_scenarios: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref != inputs.full_matrix_base && steps.scenarios.outputs.changes != '[]') && steps.scenarios.outputs.changes || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            ansible:
              - '**.yml'
              - '**.yaml'
              - '**.j2'
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'molecule/**'
              - '.ansible-lint'
              - '.yamllint'
              - 'requirements.yml'
              # Callers gate pytest and ansible-lint on THIS filter, so a
              # test-only change has to match it. The globs above cover YAML
              # suites via '**.yml', but a Python suite under tests/ matched
              # nothing: both jobs reported SKIPPED, Merge Gate allowed the
              # skips, and a test-only PR could merge on a green board having
              # never been run. Same fix already applied to the molecule filter
              # below — they were fixed separately because they gate different
              # jobs, which is exactly why the second gap survived the first.
              - 'tests/**'
            molecule:
              - 'roles/**'
              - 'molecule/**'
              - '.config/molecule/**'
              - 'requirements.yml'
              # Suites that live outside molecule/ but run under the molecule
              # workflow. Without these, editing one of those tests does not
              # run it: a change confined to the suite leaves this filter
              # false, every molecule job is skipped, and the PR merges green
              # having never exercised the thing it changed.
              - 'tests/**'
      # Per-scenario narrowing. `changes` is a JSON array of the filter names
      # that matched, which feeds the molecule matrix directly — the same
      # off-the-shelf action, no scripts. Skipped (and so empty) when the
      # caller passes no map, which is what keeps this back-compatible.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: scenarios
        if: ${{ inputs.molecule_scenario_filters != '' }}
        with:
          filters: ${{ inputs.molecule_scenario_filters }}

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ansible-lint installs requirements.yml's collections itself (default,
      # non-offline behavior) before it can resolve FQCN modules — this repo
      # never passes the action's own `requirements_file` input, so that
      # install happens silently inside the "Run ansible-lint" step. Uncached,
      # every run re-installs the same fixed set from scratch, including the
      # `type: git` entries ansible-galaxy fetches by full clone. That's a
      # flat, avoidable network cost this job pays on every single invocation
      # regardless of what changed, and it is what pushed several runs past
      # the 15-minute timeout on 2026-09-15 (unrelated PRs on unrelated
      # branches, all cancelled at ~15m during this step) — same failure mode
      # as an ambient Galaxy/GitHub slowdown, but one this cache absorbs on a
      # hit instead of paying again. Same key and paths as the molecule job's
      # cache below, so a warm run of either job warms the other.
      - name: Cache Ansible Galaxy content
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
          # A branch that edits requirements.yml gets a new key and would
          # otherwise pay the full uncached install — exactly the branches
          # most likely to be waiting on this job. ansible-lint's internal
          # install is unconditional, so a partial restore still helps: the
          # unchanged collections are already present and only the edited
          # entry is fetched. Safe because that install reconciles whatever
          # it finds against requirements.yml rather than trusting the tree.
          restore-keys: |
            ansible-galaxy-${{ runner.os }}-
      - uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294 # v26
        with:
          args: ${{ inputs.lint_args }}

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: changes
    if: ${{ inputs.molecule && needs.changes.outputs.molecule == 'true' }}
    # Molecule gets its own label so it can run on the self-hosted fleet while
    # the quick jobs stay hosted. Fork PRs fall back to ubuntu-latest.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.molecule_runner_label || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Empty means "run everything" — the changes job already applied every
        # widening rule (see its output comment).
        scenario: ${{ fromJSON(needs.changes.outputs.molecule_scenarios != '' && needs.changes.outputs.molecule_scenarios || inputs.molecule_scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: ${{ inputs.molecule_requirements }}
      - name: Install molecule + dependencies
        env:
          REQ: ${{ inputs.molecule_requirements }}
        run: uv pip install --system -r "$REQ"
      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # and roles are already present, so the forced reinstalls below are skipped;
      # on a miss (requirements.yml changed) they run and repopulate the cache.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install Ansible collections
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml --force
      # `collection install` ignores a `roles:` key, so any role a repo pins in
      # requirements.yml (e.g. splunk.splunk, the shared inventory_resolve) was
      # never installed. Skips cleanly when the file has no `roles:` entries.
      - name: Install Ansible roles
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy role install -r requirements.yml --force
      - name: Fetch Doppler secrets
        if: ${{ inputs.molecule_doppler }}
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.doppler_token }}
          doppler-project: ${{ inputs.doppler_project }}
          doppler-config: ${{ inputs.doppler_config }}
          inject-env-vars: true
      - name: Run molecule
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  # Token budgets reach the Ansible fleet only from here. _token-limits.yml is
  # otherwise only wired through _ci-gate.yml, and no Ansible repo calls that —
  # every one of them wires THIS workflow directly, so the budget was
  # unreachable for the whole fleet. It is a no-op in a repo with no
  # .token-limits.yaml, so adding it changes nothing until a repo opts in by
  # committing one.
  token-limits:
    name: Token Limits
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/_token-limits.yml@main
    with:
      runner_label: ${{ inputs.runner_label }}

  # Reachability: every Ansible repo in the org calls THIS workflow directly,
  # not `_ci-gate.yml` — so `_renovate-annotations.yml` is otherwise
  # unreachable for the whole fleet, the same gap token-limits had above.
  # Opt-in (unlike token-limits, this is NOT a no-op-by-absence check, so it
  # stays behind its own toggle rather than running unconditionally).
  renovate-annotations:
    name: Renovate Annotations
    needs: changes
    if: ${{ inputs.renovate_annotations && needs.changes.outputs.ansible == 'true' }}
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/_renovate-annotations.yml@main
    with:
      runner_label: ${{ inputs.runner_label }}

  gate:
    name: Merge Gate
    needs: [changes, ansible-lint, molecule, token-limits, renovate-annotations]
    if: ${{ inputs.emit_gate && always() && !cancelled() }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: ansible-lint, molecule, token-limits, renovate-annotations
          jobs: ${{ toJSON(needs) }}
