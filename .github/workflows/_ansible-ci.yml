# Reusable: Ansible CI (Merge Gatekeeper for ansible repos)
#
# Centralizes the ansible CI that drifted into divergent inline/local workflows
# across ansible-proxmox, ansible-proxmox-apps and ansible-splunk. Owns the parts
# that must be consistent, using only off-the-shelf actions (no scripts):
#
#   changes      -> dorny/paths-filter on ONE standardized filter (incl. *.j2)
#   ansible-lint -> ansible/ansible-lint
#   molecule     -> matrix from the caller's `molecule_scenarios`, optional
#                   Doppler secrets via dopplerhq/secrets-fetch-action
#   gate         -> name MUST stay "Merge Gate" (branch-protection ruleset)
#
# Repo-specific data-contract tests (inventory schema/load, template render,
# bespoke syntax) and self-hosted e2e are NOT centralized — they live in the
# caller, which sets emit_gate:false and runs its own "Merge Gate" aggregating
# this workflow's result plus the local jobs.
#
# Thin caller (no extra local jobs):
#   jobs:
#     ci:
#       permissions: { contents: read, pull-requests: read }
#       uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main

name: _ansible-ci

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version for the molecule job.
        type: string
        default: "3.13"
      lint_args:
        description: Extra args for ansible/ansible-lint (e.g. 'playbooks/ roles/').
        type: string
        default: ""
      molecule:
        description: Enable the molecule job (gated on the `molecule` filter).
        type: boolean
        default: true
      molecule_scenarios:
        description: JSON array of molecule scenario names to run as a matrix.
        type: string
        default: '["default"]'
      molecule_requirements:
        description: >-
          Pip requirements file with the molecule job's dependencies (each repo
          owns one so its driver + version pins are respected).
        type: string
        default: "requirements-ci.txt"
      molecule_doppler:
        description: Inject iac-conf-mgmt secrets into the molecule job (needs doppler_token).
        type: boolean
        default: false
      doppler_project:
        description: Doppler project for molecule secrets.
        type: string
        default: "iac-conf-mgmt"
      doppler_config:
        description: Doppler config for molecule secrets.
        type: string
        default: "prd"
      emit_gate:
        description: >-
          Emit the required "Merge Gate". Set false when the CALLER runs its own
          "Merge Gate" aggregating repo-local jobs (avoids a duplicate check).
        type: boolean
        default: true
      runner_label:
        description: Runner label for all jobs.
        type: string
        default: ubuntu-latest
    secrets:
      doppler_token:
        description: Doppler service token, only needed when molecule_doppler is true.
        required: false
    outputs:
      ansible:
        description: >-
          Whether ansible-relevant files changed (the standardized filter).
          Callers gate their own repo-local jobs on this so every job in the
          repo shares ONE change-detection definition.
        value: ${{ jobs.changes.outputs.ansible }}
      molecule:
        description: Whether molecule-relevant files changed (the standardized filter).
        value: ${{ jobs.changes.outputs.molecule }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner_label }}
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      molecule: ${{ steps.filter.outputs.molecule }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            ansible:
              - '**.yml'
              - '**.yaml'
              - '**.j2'
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'molecule/**'
              - '.ansible-lint'
              - '.yamllint'
              - 'requirements.yml'
            molecule:
              - 'roles/**'
              - 'molecule/**'
              - '.config/molecule/**'
              - 'requirements.yml'

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - uses: actions/checkout@v6
      - uses: ansible/ansible-lint@v26
        with:
          args: ${{ inputs.lint_args }}

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: changes
    if: ${{ inputs.molecule && needs.changes.outputs.molecule == 'true' }}
    runs-on: ${{ inputs.runner_label }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.molecule_scenarios) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: latest
      - name: Install molecule + dependencies
        env:
          REQ: ${{ inputs.molecule_requirements }}
        run: uv pip install --system -r "$REQ"
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force
      # `collection install` ignores a `roles:` key, so any role a repo pins in
      # requirements.yml (e.g. splunk.splunk, the shared inventory_resolve) was
      # never installed. Skips cleanly when the file has no `roles:` entries.
      - name: Install Ansible roles
        run: ansible-galaxy role install -r requirements.yml --force
      - name: Fetch Doppler secrets
        if: ${{ inputs.molecule_doppler }}
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.doppler_token }}
          doppler-project: ${{ inputs.doppler_project }}
          doppler-config: ${{ inputs.doppler_config }}
          inject-env-vars: true
      - name: Run molecule
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  gate:
    name: Merge Gate
    needs: [changes, ansible-lint, molecule]
    if: ${{ inputs.emit_gate && always() && !cancelled() }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: ansible-lint, molecule
          jobs: ${{ toJSON(needs) }}
