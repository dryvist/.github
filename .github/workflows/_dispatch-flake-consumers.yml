# Reusable: Dispatch a repository_dispatch to downstream consumers
#
# Fans out a repository_dispatch (event_type=update-flake-input) to every repo in
# the caller's DISPATCH_CONSUMERS variable. The client_payload carries
#   input  = source_input   the flake input the releasing repo represents downstream
#   repo   = the releasing repository's name
#   tag    = release_tag   the release being announced (empty when none)
# Each caller keeps its own trigger and its own DISPATCH_CONSUMERS list; this
# workflow holds the shared token-mint and cross-repo dispatch call so it lives
# in exactly one place.
#
# The event_type defaults to update-flake-input: every flake-consumer's
# deps-flake-lock.yml listens for exactly that name. A caller with a different
# downstream listener overrides it via the event_type input.
#
# WHAT THE FLAKE CONSUMER DOES. The receiver relocks the input named in
# client_payload.input alone (`nix flake update <input>`) when that name is a root
# input of its flake.lock, and otherwise relocks the whole lock except first-party
# inputs — see _update-flake-lock.yml, which validates the name before use. The
# consumer's PR branch is always chore/flake-lock, so a repo has one open flake PR.
# client_payload.repo and client_payload.tag are informational: nothing acts on them.
#
# vars.DISPATCH_CONSUMERS, vars.GH_APP_CLIENT_ID, and the
# GH_APP_PRIVATE_KEY secret all resolve in the caller's context
# (workflow_call inherits the caller's vars/secrets), so they are read
# here directly rather than passed as inputs. Pass GH_APP_PRIVATE_KEY
# via `secrets: inherit` in the caller.
name: _dispatch-flake-consumers

on:
  workflow_call:
    inputs:
      source_input:
        description: >-
          Flake input name the releasing repo represents downstream.
          Sent as client_payload.input so the consumer knows which input
          to bump. Defaults to the calling repository's own name.
        type: string
        required: false
        default: ${{ github.event.repository.name }}
      release_tag:
        description: >-
          Release tag of the producer being announced, for example v1.2.0.
          Sent as client_payload.tag. Empty when the caller has no release.
        type: string
        required: false
        default: ""
      event_type:
        description: >-
          repository_dispatch event_type to send. Defaults to
          update-flake-input for flake-lock consumers; override for a
          different downstream listener.
        type: string
        required: false
        default: update-flake-input
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  dispatch:
    name: Notify ${{ matrix.repo }}
    strategy:
      # Each consumer is an independent notification, so one unreachable target
      # must not cancel delivery to the rest. It also keeps every target's
      # verdict in the run: under fail-fast the siblings are cancelled at the
      # same step, which looks identical to them failing for the same reason.
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(vars.DISPATCH_CONSUMERS) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No job-level permissions: every caller sets `permissions: {}`, and a
    # called workflow may only downgrade — requesting more than the caller
    # grants fails workflow-graph validation (startup_failure). All API
    # access below uses the minted App token, never GITHUB_TOKEN.
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Scope the minted token to just the one consumer repo.
          repositories: ${{ matrix.repo }}
          # repository_dispatch requires contents:write on the target.
          permission-contents: write

      - name: Dispatch consumer event
        # Use env vars — never interpolate inputs or matrix directly into
        # run: steps (expression injection risk).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ matrix.repo }}
          SOURCE_INPUT: ${{ inputs.source_input }}
          PRODUCER_REPO: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/dispatches" \
            -f event_type="${EVENT_TYPE}" \
            -f "client_payload[input]=${SOURCE_INPUT}" \
            -f "client_payload[repo]=${PRODUCER_REPO}" \
            -f "client_payload[tag]=${RELEASE_TAG}"
